name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le projet
        run: npm run build

      - name: Regrouper les fichiers statiques dans .output/public
        run: |
          # Sur GitHub, la compilation écrit directement dans .output/public.
          # Dans d'autres environnements, elle écrit dans dist/client : on le copie alors.
          if [ -d dist/client ]; then
            rm -rf .output/public
            mkdir -p .output
            cp -r dist/client .output/public
          fi
          ls .output/public

      - name: Vérifier que toutes les pages statiques existent
        run: |
          missing=0
          for p in "" a-propos modes modes/facile-p modes/facile-pp modes/vocal-p modes/vision-p modes/vision-pp modes/lecture-p modes/lecture-pp modes/pointage-p modes/moteur-p modes/moteur-pp modes/audio-p modes/lsf-p modes/serein-p modes/pointage-pp modes/graphique-p; do
            f=".output/public/${p:+$p/}index.html"
            if [ ! -f "$f" ]; then echo "Page manquante : $f"; missing=1; fi
          done
          exit $missing

      - name: Mettre à disposition le site statique
        uses: actions/upload-artifact@v4
        with:
          name: site-statique
          path: .output/public
